<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RingPlayer</title>
  <style>
    :root {
      color-scheme: light;
      --accent: #f15a3b;
      --text: #181818;
      --muted: #666;
      --line: #e8e8e8;
      --bg: #fafafa;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 72px 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 44px;
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      font-size: 18px;
      line-height: 1.65;
      color: var(--muted);
    }

    nav {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>RingPlayer</h1>
    <p>A local audio player that remembers your progress. Import long-form audio, organize your library, and pick up exactly where you left off.</p>
    <p>圆环播放器是一款会记录播放进度的本地音频播放器。导入长音频、整理分类，随时从上次停下的位置继续播放。</p>

    <p><a href="./support/#purchase-transition">Upcoming purchase model update / 购买方式调整公告</a></p>

    <nav aria-label="Site links">
      <a href="./support/">Support</a>
      <a href="./privacy/">Privacy Policy</a>
    </nav>
  </main>
</body>
</html>
