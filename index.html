<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OhMyPod</title>
  <style>
    :root {
      color-scheme: light;
      --accent: #d45b37;
      --text: #181818;
      --muted: #666;
      --line: #e8e8e8;
      --bg: #fafafa;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 72px 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 44px;
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      font-size: 18px;
      line-height: 1.65;
      color: var(--muted);
    }

    nav {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>OhMyPod</h1>
    <p>Your private local podcast library. Import local audio, organize episodes, track listening progress, and listen at your own pace.</p>
    <p>你的私人本地播客库。导入本地音频，整理分类，自动记录进度，随时接着听。</p>

    <nav aria-label="Site links">
      <a href="./support/">Support</a>
      <a href="./privacy/">Privacy Policy</a>
    </nav>
  </main>
</body>
</html>
